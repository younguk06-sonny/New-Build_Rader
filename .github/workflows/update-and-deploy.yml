# 매일 아침 공공 API에서 자료를 받아 저장하고 GitHub Pages로 배포합니다.
# 저장소 Settings → Secrets and variables → Actions 에 DATA_GO_KR_KEY, KOSIS_KEY 를 넣어 두세요.
name: 데이터 갱신 및 배포

on:
  schedule:
    - cron: '17 22 * * *'   # 매일 07:17 (한국시간)
  workflow_dispatch:        # Actions 탭에서 'Run workflow'로 바로 실행
  push:
    branches: [main]

permissions:
  contents: write   # 받은 자료를 저장소에 저장
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 공공 API에서 자료 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
        run: node scripts/fetch-data.mjs

      - name: 바뀐 자료 저장(커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data cache
          if git diff --cached --quiet; then
            echo "바뀐 자료 없음"
          else
            git commit -m "자료 자동 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
