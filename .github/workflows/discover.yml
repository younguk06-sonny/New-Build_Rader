# KOSIS 통계표 찾기 (임시 작업)
name: 통계표 찾기
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/discover.mjs']
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/discover.mjs
        env:
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/discover.json
          git commit -m "통계표 찾기 결과" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
